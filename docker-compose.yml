services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-central}
      POSTGRES_DB: ${POSTGRES_DB:-central}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-central}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-central}:${POSTGRES_PASSWORD:-central}@db:5432/${POSTGRES_DB:-central}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}  # free token from brapi.dev, put it in .env (git-ignored)
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  worker:  # refreshes quotes automatically during market hours (see backend/app/worker.py)
    build: ./backend
    command: python -u -m app.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-central}:${POSTGRES_PASSWORD:-central}@db:5432/${POSTGRES_DB:-central}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      - api
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
